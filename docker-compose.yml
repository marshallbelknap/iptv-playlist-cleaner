# Synology Container Manager > Project > Create > paste this, then fill in the provider links and token.
services:
  iptv-cleaner:
    image: ghcr.io/marshallbelknap/iptv-playlist-cleaner:latest
    container_name: iptv-cleaner
    pull_policy: always   # fetch the newest version every time the project is built
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      # The part after PROVIDER_URL_ becomes the playlist name: PROVIDER_URL_PRIVATE_IPTV -> /private-iptv.m3u
      PROVIDER_URL_PRIVATE_IPTV: "PASTE_PRIVATE_IPTV_M3U_LINK_HERE"
      PROVIDER_URL_KINGDOM_IPTV: "PASTE_KINGDOM_IPTV_M3U_LINK_HERE"
      # optional backup servers for a provider, tried in order when its main server is down:
      # PROVIDER_MIRRORS_KINGDOM_IPTV: "backup1.example.com backup2.example.com"
      ACCESS_TOKEN: "PICK_ANY_LONG_RANDOM_WORD"
      CACHE_MINUTES: "30"     # how often playlists are re-cleaned
      GUIDE_MINUTES: "60"     # how often the guide is rebuilt (event slots, new listings)
      GUIDE_DAYS: "3"         # how many days ahead the guide goes (lower = smaller, faster to load)
    volumes:
      - iptv-cache:/cache     # keeps downloaded guide data between restarts (managed by Docker, no folder needed)

volumes:
  iptv-cache:
