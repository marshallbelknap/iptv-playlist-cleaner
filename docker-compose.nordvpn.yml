# Same as docker-compose.yml, plus a NordVPN connection (Gluetun) that one or more providers' playlist
# downloads go through - for when your internet provider blocks an IPTV server.
# Synology Container Manager > Project > Create > paste this, then fill in the values in CAPITALS.
services:
  vpn:
    image: qmcgaw/gluetun:v3
    container_name: iptv-vpn
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: "nordvpn"
      VPN_TYPE: "openvpn"
      # NordVPN *service credentials* (Nord Account > NordVPN > Set up NordVPN manually), not your login
      OPENVPN_USER: "NORDVPN_SERVICE_USERNAME"
      OPENVPN_PASSWORD: "NORDVPN_SERVICE_PASSWORD"
      SERVER_COUNTRIES: "United States"
      HTTPPROXY: "on"            # the cleaner downloads through this proxy (port 8888)
      HTTPPROXY_LOG: "off"

  iptv-cleaner:
    image: ghcr.io/marshallbelknap/iptv-playlist-cleaner:latest
    container_name: iptv-cleaner
    pull_policy: always
    restart: unless-stopped
    depends_on:
      - vpn                           # the cleaner retries while NordVPN is still connecting
    ports:
      - "8765:8765"
    environment:
      PROVIDER_URL_PRIVATE_IPTV: "PASTE_PRIVATE_IPTV_M3U_LINK_HERE"
      PROVIDER_URL_KINGDOM_IPTV: "PASTE_KINGDOM_IPTV_M3U_LINK_HERE"
      # PROVIDER_MIRRORS_KINGDOM_IPTV: "backup1.example.com backup2.example.com"
      PROVIDER_PROXY_KINGDOM_IPTV: "http://vpn:8888"     # only Kingdom goes through NordVPN
      ACCESS_TOKEN: "PICK_ANY_LONG_RANDOM_WORD"
      CACHE_MINUTES: "30"
      GUIDE_MINUTES: "60"
      GUIDE_DAYS: "3"
    volumes:
      - iptv-cache:/cache

volumes:
  iptv-cache:
